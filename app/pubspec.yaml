name: app
description: Toc Toc - App Flutter com arquitetura em camadas (UDF, MVVM, BLoC).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  get_it: ^8.0.3
  go_router: ^14.8.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  camera: ^0.11.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_litert: ^3.9.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
